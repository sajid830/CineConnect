
services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cineconnect-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cineconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectcine321}
      POSTGRES_DB: ${POSTGRES_DB:-cineconnect_db}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      # Windows host port 5433 -> Docker PostgreSQL port 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cineconnect} -d ${POSTGRES_DB:-cineconnect_db}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - cineconnect_network

  # ============================================================================
  # FastAPI Asynchronous Backend Service
  # ============================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: cineconnect-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ../.env

    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-CineConnect}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:8000,http://10.0.2.2:8000}

      POSTGRES_USER: ${POSTGRES_USER:-cineconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectcine321}
      POSTGRES_DB: ${POSTGRES_DB:-cineconnect_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # FastAPI connects using Docker's internal service hostname.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cineconnect}:${POSTGRES_PASSWORD:-connectcine321}@postgres:5432/${POSTGRES_DB:-cineconnect_db}

      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - cineconnect_network

# ==============================================================================
# Persistent Database Storage
# ==============================================================================
volumes:
  postgres_data:
    name: cineconnect_postgres_data

# ==============================================================================
# Docker Network
# ==============================================================================
networks:
  cineconnect_network:
    name: cineconnect_network
    driver: bridge
