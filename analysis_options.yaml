# This file configures the root analyzer for the CineConnect repository.
#
# The active Flutter application is located under mobile/ and maintains its own
# dedicated analysis_options.yaml that includes package:flutter_lints/flutter.yaml.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
